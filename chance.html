function sim(a,path,bo){
 wk.set(a);RS=0;RC=0;
 for(let k=0;k<path.length;k++)wk[path[k]]=0; // なぞって消えたぷよは得点にならない
 fall();
 for(;;){
  stamp++;let ne=0;
  for(let i=0;i<N;i++){const v=wk[i];if(!v||seen[i]===stamp)continue;
   const s0=ne;er[ne++]=i;seen[i]=stamp;
   for(let q=s0;q<ne;q++){const nb=NB4[er[q]];for(let k=0;k<nb.length;k++){const j=nb[k];if(seen[j]!==stamp&&wk[j]===v){seen[j]=stamp;er[ne++]=j;}}}
   if(ne-s0<4)ne=s0;}
  if(!ne)break;
  RC++;for(let k=0;k<ne;k++){const i=er[k];RS+=bo[i]?3:1;wk[i]=0;}
  fall();}
 CL=1;for(let i=0;i<N;i++)if(wk[i]){CL=0;break;}
}
function solve(p,bo){
 const a=p.a,seenS=new Set(),path=[];let bs=-1,bc=0,bl=9,bp=null,bcl=0;
 const dfs=()=>{
  let key=0;for(let k=0;k<path.length;k++)key+=POW[path[k]];
  if(!seenS.has(key)){seenS.add(key);sim(a,path,bo);
   if(RS>bs||(RS===bs&&(RC>bc||(RC===bc&&path.length<bl)))){bs=RS;bc=RC;bl=path.length;bp=path.slice();bcl=CL;}}
  if(path.length===5)return;
  const nb=NB8[path[path.length-1]];
  for(let k=0;k<nb.length;k++){const j=nb[k];if(a[j]&&path.indexOf(j)<0){path.push(j);dfs();path.pop();}}
 };
 for(let s=0;s<N;s++)if(a[s]){path.push(s);dfs();path.pop();}
 sim(a,p.route,bo);
 return{best:{sc:bs,ch:bc,path:bp,clear:!!bcl},basic:{sc:RS,ch:RC,path:p.route,clear:!!CL},cnt:seenS.size};
}
const $=s=>document.querySelector(s);
const boost=new Array(N).fill(0);
let res=null,sb=null,cur=0,mode='best';
function drawBoost(){$('#bg').innerHTML=boost.map((v,i)=>`<div class="cell${v?' bo':''}" data-i="${i}">${v?'×3':''}</div>`).join('');status();}
function status(){$('#st').textContent=!res?'未探索':(sb!==boost.join('')?'⚠ ブーストが変更されています。「探索」で再探索':`探索済み（全${P.length}問）`);}
$('#bg').onclick=e=>{const i=e.target.closest('.cell')?.dataset.i;if(i==null)return;boost[i]^=1;drawBoost();};
$('#clr').onclick=()=>{boost.fill(0);drawBoost();};
$('#go').onclick=async()=>{
 const bo=boost.slice(),out=[];$('#go').disabled=true;
 let t0=performance.now();for(let i=0;i<P.length;i++){if(performance.now()-t0>60){$('#st').textContent=`探索中… ${i+1}/${P.length}`;await new Promise(r=>setTimeout(r));t0=performance.now();}out.push(solve(P[i],bo));}
 res=out;sb=bo.join('');$('#go').disabled=false;status();list();
};
function list(){
 const el=$('#ls');if(!res){el.innerHTML='<p class="mut">先に「探索」を押してください。</p>';return;}
 const n=+$('#sn').value,c=+$('#sc').value,k=+$('#cs').value,gain=i=>res[i].best.sc-res[i].basic.sc;
 const ix=P.map((p,i)=>i).filter(i=>(!n||P[i].n===n)&&(!c||P[i].ch===c)).sort((a,b)=>gain(b)-gain(a)||res[b].best.sc-res[a].best.sc);
 if(!ix.length){el.innerHTML='<p class="mut">該当する問題がありません。</p>';return;}
 const bo=sb.split('').map(Number),fs=Math.max(11,30-k*3),fc=Math.max(9,Math.round(fs*.75));
 el.innerHTML=`<div class="gr" style="grid-template-columns:repeat(${k},1fr)">`+ix.map(i=>{
  const p=P[i],t=new Set(res[i].best.path),g=gain(i);
  return`<div class="th" data-i="${i}"><div class="bd">${p.b.split('').map((v,j)=>`<div class="cell${bo[j]?' bo':''}">${v==='.'?'':`<div class="pz${t.has(j)?' t':''}" style="background:${COL[v]}"></div>`}</div>`).join('')}</div><span class="cl" style="font-size:${fc}px${res[i].best.ch>p.ch?';color:var(--acc);opacity:.85':''}">${p.ch}→${res[i].best.ch}${k>=5?'':'連鎖'}</span><span class="pl" style="font-size:${fs}px${g>0?';color:var(--acc);opacity:.85':''}">+${g}</span>${p.m?`<span class="mk" style="font-size:${fc}px">↔</span>`:''}</div>`}).join('')+'</div>';
}
$('#sn').onchange=$('#sc').onchange=$('#cs').onchange=list;
$('#ls').onclick=e=>{const b=e.target.closest('.th');if(!b)return;cur=+b.dataset.i;mode='best';$('#main').hidden=true;$('#dt').hidden=false;detail();window.scrollTo(0,0);};
$('#bk').onclick=()=>{$('#dt').hidden=true;$('#main').hidden=false;};
$('#mb').onclick=()=>{mode='best';detail();};$('#mv').onclick=()=>{mode='basic';detail();};
function detail(){
 const p=P[cur],r=res[cur],s=mode==='best'?r.best:r.basic,bo=sb.split('').map(Number);
 $('#mv').disabled=!r.basic;$('#mb').className=mode==='best'?'p':'';$('#mv').className=mode==='basic'?'p':'';
 const ord={};if(s)s.path.forEach((v,k)=>ord[v]=k+1);
 $('#inf').innerHTML=`<b>${p.id}</b>（${p.n}個消し・基本${p.ch}連鎖${p.m?'・左右反転':''}）<br>`+(s?`${mode==='best'?'最適解':'基本解'}：<b>${s.sc}点</b>／${s.ch}連鎖／なぞり${s.path.length}個／${s.clear?'全消し':'盤面が残る'}`+(mode==='best'&&r.basic?`<br><span class="mut">基本解 ${r.basic.sc}点（${r.best.sc>r.basic.sc?'最適解の方が高い':'基本解が最適'}）／探索した消し方 ${r.cnt}通り</span>`:''):'基本解なし');
 $('#db').innerHTML=p.b.split('').map((v,i)=>`<div class="cell${bo[i]?' bo':''}">${v==='.'?'':`<div class="pz${ord[i]?' t':''}" style="background:${COL[v]}">${ord[i]||''}</div>`}</div>`).join('');
}
// ===== 画像(スクショ)からブーストエリアを読み取る（ぷよクエ解析シミュレータと同じ方式）=====
// 行ごと・列ごとの色数から盤面の範囲を自動で切り出し、各マスの四隅が白飛びしていればブースト
$('#pick').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{try{readBoost(im)}catch(x){$('#im').textContent='読み取りエラー：'+x.message}};
 im.onerror=()=>{$('#im').textContent='画像を読み込めませんでした'};
 im.src=URL.createObjectURL(f);e.target.value='';};
function readBoost(img){
 const w=img.width,h=img.height,cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
 const d=cx.getImageData(0,0,w,h).data,rc=new Array(h);
 for(let y=0;y<h;y++){const u=new Set();for(let x=0;x<w;x++){const i=(y*w+x)*4;u.add(d[i]<<16|d[i+1]<<8|d[i+2]);}rc[y]=u.size;}
 let top=0,bot=h,plateau=false,low=0;const y0=Math.floor(h*.5),yl=Math.floor(h*.8);
 for(let y=y0;y<h;y++){
  if(!plateau){if(rc[y]<=40){if(++low>=3)plateau=true;}else low=0;}
  else if(top===0){if(rc[y]>=70)top=y;}
  if(y>=yl&&rc[y]<=40){bot=y;break;}}
 const fh=bot-top,aT=Math.floor(top+fh*.25),aB=Math.floor(bot-fh*.25);
 if(fh<=0||aB<=aT){$('#im').textContent='盤面の上下を検出できませんでした';return;}
 const cc=new Array(w);
 for(let x=0;x<w;x++){const u=new Set();for(let y=aT;y<aB;y++){const i=(y*w+x)*4;u.add(d[i]<<16|d[i+1]<<8|d[i+2]);}cc[x]=u.size;}
 let left=0,gap=false,ll=0,right=w,rl=0;
 for(let x=0;x<w;x++){if(!gap){if(cc[x]<=10){if(++ll>=3)gap=true;}else ll=0;}else if(cc[x]>=40){left=x;break;}}
 for(let x=Math.floor(w*.7);x<w;x++){if(cc[x]<=10){if(++rl>=3){right=x-1;break;}}else rl=0;}
 const fw=right-left;
 if(fw<=0){$('#im').textContent='盤面の左右を検出できませんでした';return;}
 // 画面の並び：NEXT行(高さ1) ＋ 盤面6行(各高さ2) ＝ 13等分
 const uH=fh/13,uW=fw/8,nb=new Array(N).fill(0),o=4;let cnt=0;
 for(let r=0;r<6;r++)for(let c=0;c<8;c++){
  const L=left+c*uW,R=left+(c+1)*uW,T=top+uH*(1+2*r),B=T+2*uH;let sr=0,sg=0,n=0;
  for(const [px,py] of [[L+o,T+o],[R-o,T+o],[L+o,B-o],[R-o,B-o]]){const X=Math.floor(px),Y=Math.floor(py);
   if(X>=0&&X<w&&Y>=0&&Y<h){const i=(Y*w+X)*4;sr+=d[i];sg+=d[i+1];n++;}}
  if(n&&sr/n>=200&&sg/n>=200){nb[r*8+c]=1;cnt++;}}
 const pv=$('#pv');pv.width=fw;pv.height=fh;const pc=pv.getContext('2d');
 pc.drawImage(img,left,top,fw,fh,0,0,fw,fh);pc.fillStyle='rgba(232,89,12,.45)';
 for(let i=0;i<N;i++)if(nb[i])pc.fillRect((i%8)*uW,uH*(1+2*(i>>3)),uW,2*uH);
 pv.hidden=false;boost.splice(0,N,...nb);drawBoost();
 $('#im').textContent=`読み取り完了：ブースト ${cnt} マス（違うマスは上の盤面をタップして直せます）`;
}
drawBoost();list();
</script></body></html>
