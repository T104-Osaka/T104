<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
    <title>T104 home-page</title>
    <meta name="description" content="ぷよクエ解析シミュレータなどのツール一覧および開発・攻略記事のポータルサイトです。">
    <meta name="keywords" content="ぷよクエ,シミュレータ,ツール,攻略">

    <!-- OGP (SNS共有設定) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="T104 home-page">
    <meta property="og:description" content="Webツール一覧と攻略・開発記録">
    <meta name="twitter:card" content="summary">

    <style>
        /* === 基本スタイル === */
        :root {
            --key-color: #19448e;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text: #666666;
            --border-color: #e0e0e0;
            --hover-border: #f6a068;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", YuGothic, Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
            box-sizing: border-box;
        }

        /* === ヘッダー（タイトル大きめ・色そのまま） === */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--key-color);
            padding: 35px 0 25px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .site-title {
            margin: 0;
            font-size: 2.6em;
            font-weight: bold;
            color: var(--text-color);
            letter-spacing: 0.05em;
        }

        .site-description {
            font-size: 0.95em;
            color: var(--sub-text);
            margin-top: 8px;
        }

        /* === もくじ（各セクション最上部へのスムーズスクロール） === */
        .toc-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--key-color);
            border-radius: 6px;
            margin: 30px auto 20px auto;
            padding: 16px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .toc-title {
            font-weight: bold;
            font-size: 1.05em;
            color: var(--key-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toc-list {
            margin: 0;
            padding-left: 24px;
        }

        .toc-list li {
            margin: 8px 0;
        }

        .toc-list a {
            color: var(--key-color);
            font-weight: 500;
        }

        .toc-list a:hover {
            text-decoration: underline;
            color: var(--hover-border);
        }

        /* === セクション見出し === */
        h2.section-heading {
            font-size: 1.35em;
            color: #ffffff;
            background-color: var(--key-color);
            padding: 10px 16px;
            border-radius: 4px;
            margin: 45px 0 20px 0;
            display: flex;
            align-items: center;
        }

        /* === ブログカード風リンクリスト === */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .blogcard {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .blogcard:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            border-color: var(--hover-border);
        }

        .blogcard-thumb {
            flex: 0 0 160px;
            height: 95px;
            background-color: #2c3e50;
            border-radius: 4px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9em;
            overflow: hidden;
        }

        .blogcard-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .blogcard-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .blogcard-title {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--text-color);
            margin: 0 0 6px 0;
            line-height: 1.4;
        }

        .blogcard:hover .blogcard-title {
            color: var(--key-color);
        }

        .blogcard-snippet {
            font-size: 0.85em;
            color: var(--sub-text);
            line-height: 1.5;
            margin: 0 0 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blogcard-footer {
            font-size: 0.75em;
            color: #999;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .blogcard-tag {
            background: #eef2f8;
            color: var(--key-color);
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* === フッター & SNSリンク === */
        footer {
            margin-top: 60px;
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 30px 0 25px 0;
            text-align: center;
            font-size: 0.85em;
            color: var(--sub-text);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--key-color);
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
            color: var(--hover-border);
        }

        .copyright {
            margin: 0;
            color: #888888;
            font-size: 0.9em;
        }

        /* === レスポンシブ対応 (スマホ表示) === */
        @media screen and (max-width: 600px) {
            .site-title { font-size: 1.9em; }
            .blogcard { flex-direction: column; }
            .blogcard-thumb {
                width: 100%;
                height: 140px;
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="wrap">
            <h1 class="site-title">T104 home-page</h1>
            <div class="site-description">ぷよクエツール ＆ 記録</div>
        </div>
    </header>

    <main class="wrap">

        <!-- 目次 -->
        <nav class="toc-container">
            <div class="toc-title">📌 目次</div>
            <ol class="toc-list">
                <li><a href="#sec-tools">ツール一覧</a></li>
                <li><a href="#sec-blogs">記録</a></li>
            </ol>
        </nav>

        <!-- =======================================================
             ① ツール一覧セクション
             ======================================================= -->
        <section>
            <h2 id="sec-tools" class="section-heading">🛠️ ツール一覧</h2>
            
            <div class="card-list">
                <!-- ツール1 -->
                <a href="puyotukai.html" class="blogcard">
                    <div class="blogcard-thumb">
                        <span>ぷよ塗りシム</span>
                    </div>
                    <div class="blogcard-content">
                        <div>
                            <h3 class="blogcard-title">ぷよクエ塗り替えシミュレータ</h3>
                            <p class="blogcard-snippet">
                                ぷよつかい大会の盤面をC言語/WebAssemblyでシミュレーションし、ぬりかえと最適なぞり消し位置を自動算出。
                            </p>
                        </div>
                        <div class="blogcard-footer">
                            <span class="blogcard-tag">WEB TOOL</span>
                            <span>更新: 2026.08.18</span>
                        </div>
                    </div>
                </a>
            </div>
        </section>

        <!-- =======================================================
             ② ブログ・考察記事セクション
             ======================================================= -->
        <section>
            <h2 id="sec-blogs" class="section-heading">📝 記録</h2>

            <div class="card-list">
                <!-- 記事1 -->
                <a href="news20260818.html" class="blogcard">
                    <div class="blogcard-thumb" style="background-color: #34495e;">
                        <span>開発記録</span>
                    </div>
                    <div class="blogcard-content">
                        <div>
                            <h3 class="blogcard-title">【開発記】WebAssemblyとWorkerによる並列探索の最適化</h3>
                            <p class="blogcard-snippet">
                                C言語の探索ロジックをブラウザ上で高速に動かすためのマルチスレッド化とメモリ管理についての解説です。
                            </p>
                        </div>
                        <div class="blogcard-footer">
                            <span class="blogcard-tag">TECH NOTE</span>
                            <span>2026.08.18</span>
                        </div>
                    </div>
                </a>
            </div>
        </section>

    </main>

</body>
</html>
